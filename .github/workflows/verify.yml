name: Verify build
on:
  push:
    branches:
      - feat/reminder-fixes-and-cat-themes
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B verify
      - name: Check Docker build
        run: docker build -t reminderbot:ci .
