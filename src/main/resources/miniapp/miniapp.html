<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#fff8ed"/>
  <title>Мой дом — Reminder Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
  <link rel="stylesheet" href="/static/miniapp.css"/>
  <link rel="stylesheet" href="/static/visual-v2.css"/>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Главное меню">
    <button type="button" class="nav-btn active" data-page="today" aria-label="Сегодня">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Сегодня</span>
    </button>
    <button type="button" class="nav-btn" data-page="calendar" aria-label="Календарь">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 11h18"/></svg><span>Календарь</span>
    </button>
    <button type="button" class="nav-btn nav-create" data-page="newTask" aria-label="Создать дело">
      <span class="nav-create-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button type="button" class="nav-btn" data-page="team" aria-label="Команда">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 4a3 3 0 0 1 0 6M19 14c2 1 3 3 3 6"/></svg><span>Команда</span>
    </button>
    <button type="button" class="nav-btn" data-page="settings" aria-label="Профиль и настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><span>Профиль</span>
    </button>
  </nav>
  <script src="/static/miniapp.js"></script>
</body>
</html>
